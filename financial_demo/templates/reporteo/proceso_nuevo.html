{% extends "base.html" %}
{% block title %}Nuevo proceso{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">Nuevo proceso</div>
  <div class="page-sub">Selecciona el fideicomiso y el periodo a procesar</div>
</div>
<div style="max-width:480px;">
  <div class="card">
    <form method="post">{% csrf_token %}
      <div class="form-group">
        <label class="form-label">Fideicomiso</label>
        <select name="fideicomiso" class="form-control" required>
          <option value="">— selecciona —</option>
          {% for f in fideicomisos %}<option value="{{ f.id }}">{{ f.numero }} · {{ f.nombre }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Periodo (YYYY-MM)</label>
        <input type="month" name="periodo" class="form-control" required>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button type="submit" class="btn btn-primary">Crear proceso →</button>
        <a href="{% url 'dashboard' %}" class="btn">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
